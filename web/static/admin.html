<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hive Admin</title>
  <link rel="icon" href="/static/wursta-w.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=4">
  <link rel="stylesheet" href="/static/admin.css?v=1">
</head>
<body class="admin">
  <header class="top">
    <div class="brand">
      <img class="brand-logo light" src="/static/wursta-logo.svg" alt="Wursta"><img class="brand-logo dark" src="/static/wursta-logo-dark.svg" alt="Wursta">
      <div>
        <h1 data-i18n="adm.title">Hive admin</h1>
        <p class="muted" data-i18n="adm.sub">Who signed in, which demos they tried, how they rated them, and the usage limits.</p>
      </div>
    </div>
    <div class="user">
      <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
      <a class="ghost small" href="/" data-i18n="adm.back">Back to the hive</a>
      <button class="ghost small" id="refresh" data-i18n="adm.refresh">Refresh</button>
    </div>
  </header>
  <nav class="views adm-tabs" role="tablist" aria-label="Admin sections">
    <button role="tab" data-tab="overview" aria-selected="true" data-i18n="adm.t.overview">Overview</button>
    <button role="tab" data-tab="users" data-i18n="adm.t.users">Users</button>
    <button role="tab" data-tab="runs" data-i18n="adm.t.runs">Demos run</button>
    <button role="tab" data-tab="feedback" data-i18n="adm.t.feedback">Ratings</button>
    <button role="tab" data-tab="sessions" data-i18n="adm.t.sessions">Sessions</button>
    <button role="tab" data-tab="logins" data-i18n="adm.t.logins">Sign-ins</button>
    <button role="tab" data-tab="limits" data-i18n="adm.t.limits">Limits</button>
  </nav>
  <main class="adm-main">
    <section id="tab-overview"></section>
    <section id="tab-users" hidden></section>
    <section id="tab-runs" hidden></section>
    <section id="tab-feedback" hidden></section>
    <section id="tab-sessions" hidden></section>
    <section id="tab-logins" hidden></section>
    <section id="tab-limits" hidden></section>
  </main>
  <script src="/static/i18n.js?v=2"></script>
  <script src="/static/admin.js?v=1"></script>
</body>
</html>
