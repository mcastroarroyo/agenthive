  # --- Operations, strategy & writing -----------------------------------------------------------------------------
  - id: wf_sop_builder
    code: Sop
    name: SOP Builder
    cluster: ops_strategy
    industry: OPERATIONS
    status: demo_ready
    tagline: Turns rough process notes into a clear standard operating procedure with a RACI and checked steps.
    description: >-
      The SOP Builder from the Operations department turns rough notes ("the AE is supposed to fill in the handoff
      form...") into a standard operating procedure: purpose, scope, a RACI with exactly one accountable role per row,
      the trigger and inputs, numbered steps each with an imperative verb, one owner, the system and a done-when,
      exceptions and escalation with time limits, records and KPIs. A step checker enforces the rules before the
      branded Word file is delivered.
    persona: Operations, customer success and implementation leads; founders writing down how the company works
    use_cases:
      - Handoff SOP between two teams
      - Incident or escalation procedure
      - Monthly close or recurring operations checklist
    model: flash
    model_reason: Structuring messy notes into unambiguous steps needs Flash; the step rules are checked by a deterministic tool.
    tools: [get_sample_document, wf_deliverable_template, wf_brand_profile, wf_sop_check, wf_render_document]
    grounding: ["fixtures:deliverable templates and brand profile"]
    instruction: |
      1. Read the notes (get_sample_document for keys such as 'wf_brief_sop_handoff'): trigger, roles, steps, rules,
         time limits and KPIs.
      2. Call wf_deliverable_template ('sop') and wf_brand_profile (focus 'writing') once each.
      3. Draft the RACI (exactly one A per row) and 10-16 numbered steps: imperative verb first, one owner (a role,
         with the person in brackets when known), the system, a done-when and the time limit the notes give.
      4. Call wf_sop_check once with the steps and the RACI roles; fix every issue it reports (no second check).
      5. Unless the request says DRAFT ONLY, call wf_render_document once with the full SOP as markdown (docx;
         confidential true for internal SOPs; procedure as a table Step · Action · Owner · System · Done when).
      DRAFT ONLY (inside an Agent Workforce job): skip step 5 and reply with the complete SOP in markdown ("# Title",
      "## " per section, tables) and nothing else.
    output: >-
      File delivered (name, pages, file id), then the SOP at a glance: trigger, roles, number of steps, escalation
      rule, KPIs and the step-check score.
    samples:
      - Write the SOP in 'wf_brief_sop_handoff' as a Word document.
      - "SOP for handling a P1 support ticket at Kitewing: support (Liam O'Connor) acknowledges within 15 minutes, the engineering on-call fixes or works around it, the CSM updates the customer every 2 hours, and a post-incident review happens within 5 business days."
      - "SOP for the monthly invoicing close at Kitewing: Finance (Maya Singh) runs it in the first 3 business days; Customer Success confirms technician-count changes; the account executive approves credits over $500."
    sample_doc: wf_brief_sop_handoff
    related: [workforce, wf_longform_writer]
    kpis: [Process errors after the SOP, Time to onboard someone to the process, SOPs reviewed on schedule]

  - id: wf_gtm_strategist
    code: Gtm
    name: Go-To-Market Strategist
    cluster: ops_strategy
    industry: STRATEGY
    status: demo_ready
    tagline: Builds a go-to-market plan with sourced market sizing, positioning, launch phases and KPIs — as a branded deck.
    description: >-
      The Go-To-Market Strategist from the Strategy department turns a launch or expansion brief into a GTM plan:
      bottom-up market sizing (TAM, SAM, SOM) from current public data with sources, the ideal customer profile and
      buyers, positioning and messaging in the brand voice, the offer as given, a phased launch plan, sales and
      partner enablement, KPIs with targets and owners, risks and the first 90 days — delivered as a branded
      PowerPoint deck or Word document.
    persona: Founders, heads of marketing and product leaders planning a launch or a new segment
    use_cases:
      - Launch plan for a new feature or product
      - Entry plan for a new segment or region
      - Leadership-ready GTM deck with sourced sizing
    model: flash
    model_reason: Search-grounded strategy and synthesis across sizing, messaging and plan needs Flash; sizing math is a deterministic tool.
    tools: [get_sample_document, wf_deliverable_template, wf_brand_profile, wf_market_size, wf_render_document]
    grounding: [google_search, "fixtures:brand profile (approved facts)"]
    instruction: |
      1. Read the brief (get_sample_document for keys such as 'wf_brief_gtm_assist_spanish'): product status words,
         prices, dates, budget and constraints.
      2. Call wf_deliverable_template ('gtm_plan') and wf_brand_profile (focus 'writing') once each.
      3. Use Google Search at most twice for market facts (number of companies in the segment, workforce data) and
         cite [title](url). Any number without a source is labelled "estimate".
      4. Call wf_market_size once with 1-3 segments built from those counts (source = the URL or 'estimate'). Never
         compute TAM, SAM or SOM yourself.
