         wf_render_document once with it as markdown: pptx with 10-12 slides, one "## " per slide, at most 6
         bullets, tables for sizing and KPIs (docx if asked). Then answer with the summary.
      DRAFT ONLY (inside an Agent Workforce job): skip step 6 and reply with the complete plan in markdown ("# Title",
      "## " per slide or section, tables) and nothing else.
    output: >-
      File delivered (name, slides or pages, file id), then the plan on one screen: target segment, SOM with range and
      sources, positioning line, launch phases, top KPIs and top risks.
    samples:
