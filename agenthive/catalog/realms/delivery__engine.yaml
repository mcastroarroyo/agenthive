  - id: atlas_data_mover
    code: Adm
    name: Atlas Core Data Mover
    aka: Atlas 4
    cluster: atlas
    status: demo_ready
    tagline: Runs and monitors the bulk transfer — progress, throughput, errors and retries for mail, Drive and shared drives.
    description: >-
      Atlas 4 watches the bulk-copy jobs for every wave (mail, OneDrive to My Drive, file shares to Shared drives):
      items and GB moved, throughput, ETA against the delta-sync start, and errors split into transient (retry now),
      fixable (needs a source fix), policy skips and permanent failures. It queues retries with the expected recovery
      from the runbook (simulated) and escalates when a wave is at risk.
    persona: Migration engineers and the migration lead during the bulk-copy window
    use_cases:
      - Bulk transfer health check for a wave
      - Error triage and retries
      - Escalation when the ETA threatens the cutover
    model: flash
    model_reason: Error triage and escalation calls over live job data need Flash's reasoning; numbers come from the tools.
    tools: [atlas_transfer_status, atlas_retry_failed]
    grounding: [kb, "fixtures:migration run state (synthetic)"]
    instruction: |
      1. Call atlas_transfer_status — without a wave for the overview, or for the wave asked.
      2. Per workload: % complete, GB, throughput, ETA vs the delta-sync start, error rate and health.
      3. Triage errors: transient (retry now), fixable (who must fix what at source), policy skips (report only),
         permanent (report only).
      4. Call atlas_retry_failed for 'transient' when asked or when health is amber/red. For fixable classes
         (path_too_long, permission_denied_source) only retry with source_fixed=True after the user confirms the fix.
         Report expected recovery as (simulated).
      5. Escalate (owner + deadline) when the ETA misses the delta window or the error rate is red, per the runbook.
    output: Headline health; per-workload table; error triage table; actions taken (simulated) and escalations.
    samples:
      - How is the bulk transfer for W5 (Engineering) going?
      - Retry all transient errors on W5 and tell me what is left.
      - Engineering shortened the long paths — retry path_too_long on W5.
    related: [atlas_batch_planner, atlas_delta_sync, atlas_status]
    kpis: [TB moved per day, Actionable error rate, Waves with bulk complete 48 h before cutover]

  - id: atlas_delta_sync
    code: Ads
    name: Atlas Delta Sync
    aka: Atlas 5
    cluster: atlas
    status: demo_ready
    tagline: Sizes the final incremental sync, runs the go/no-go gates and starts the cutover sequence on approval.
    description: >-
      Atlas 5 owns the last mile before cutover: it measures everything that changed since the last bulk pass, checks
      that the delta fits the Friday-night window, evaluates the cutover gates (bulk completion, error rate, delta
      fit) and the cutover checklist, and gives a GO / CONDITIONAL GO / NO-GO brief. When the sponsor approves, it
      starts the delta sync and the MX switch sequence (simulated).
    persona: Migration lead, client IT director and the go/no-go approver
    use_cases:
      - Go/no-go brief the afternoon before cutover
      - Delta size what-ifs (later start, extra users)
      - Starting the cutover sequence with the approver recorded
    model: flash
    model_reason: A go/no-go recommendation weighs gates, checklist and timing — Flash, with every figure from tools.
    tools: [atlas_delta_scan, atlas_cutover_readiness, atlas_run_delta_sync]
    grounding: [kb, "fixtures:migration run state (synthetic)"]
    instruction: |
      1. Call atlas_delta_scan for the wave (default: W4, cutting over 2026-11-07); pass delta_start for what-ifs.
      2. Call atlas_cutover_readiness for the same wave.
      3. Go/no-go brief: verdict first; gates table; open critical checklist items with owner and ETA; delta size,
         projected finish vs the 12-hour window; rollback point. Use the cutover checklist in the knowledge base.
      4. Only when the user confirms the decision and names the approver, call atlas_run_delta_sync and report the
         timeline as (simulated).
      5. Never recommend GO with a failed gate; a CONDITIONAL GO lists each condition and its deadline (delta start).
    output: Verdict line; gates table; open items; delta estimate; cutover timeline (when started — simulated).
    samples:
      - Are we ready to cut over W4 (Sales) tomorrow? Give me the go/no-go brief.
      - How big will the final delta for W4 be if we start at 20:00 instead of 18:00?
      - Robert Lindqvist (CIO) approved go for W4 — start the delta sync.
    related: [atlas_data_mover, atlas_validator, atlas_status]
    kpis: [Cutovers inside the window, Rollbacks, Delta size vs estimate]

  - id: atlas_validator
    short_name: Migration Validator
    code: Apv
    name: Atlas Post-Migration Validator
    aka: Atlas 6
    cluster: atlas
    status: demo_ready
    tagline: Proves the migration is complete — item counts, checksum samples and permission audits with a discrepancy report.
    description: >-
      Atlas 6 validates each migrated wave: source vs target item counts per workload with explained skips (oversize
      items, blocked types, long paths) and unexplained variance against the 0.1% tolerance, a checksum sample, and a
      permission audit — ACLs mapped, orphaned entries dropped, delegations and shared-mailbox groups recreated,
      external shares found. Open discrepancies come with owner, fix and due date.
    persona: Migration lead, QA and the client IT owner signing off a wave
    use_cases:
      - Wave sign-off evidence
      - Discrepancy report with owners
      - Cross-wave quality trends
    model: flash
    model_reason: Interpreting validation evidence and writing a defensible sign-off needs Flash; the checks are deterministic.
    tools: [atlas_validate_wave]
    grounding: [kb, "fixtures:migration run state (synthetic)"]
    instruction: |
      1. Call atlas_validate_wave for the wave (all checks unless asked). For cross-wave questions call it for each
         migrated wave (W0-W3).
      2. Verdict first (PASS / PASS WITH EXCEPTIONS / FAIL); counts table per workload (source, target, explained
         skips, unexplained, variance vs tolerance); checksum sample; permissions summary.
      3. Discrepancy report: id, detail, owner, fix, due, linked issue.
      4. State what users must be told (e.g. items over 25 MB skipped) per the migration runbook in the knowledge
         base.
      5. For a wave not yet cut over, say so and point to Atlas Delta Sync or Atlas Core Data Mover.
    output: Verdict; counts table; checksum and permission summary; discrepancy table; user-facing notes; sign-off recommendation.
    samples:
      - Validate wave W3 and give me the discrepancy report.
      - Did every delegation and shared-mailbox group come across in W3?
      - Compare validation results for W0 to W3 — is there a pattern?
    related: [atlas_delta_sync, atlas_status, vdr_validator]
    kpis: [Unexplained variance, Discrepancies closed within 72 h, Post-migration data tickets]

