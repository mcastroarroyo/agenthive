  - id: morpheus
    code: Mor
    name: Morpheus · Dream-to-Demo Agent
    cluster: innovation
    status: in_build
    tagline: Turns a one-line concept into a clickable demo and a draft SOW outline in minutes.
    description: >-
      Morpheus is the rapid-prototyping engine: a builder designs the screens of the core user journey and renders a
      self-contained clickable HTML demo, a critic checks it against the concept and the demo checklist, and the pair
      iterate (ADK LoopAgent) until it is ready. The final step hands back the demo and a draft SOW outline — phases,
      deliverables, effort and an estimate range — so a discovery call can end with something the client can click.
    persona: Pre-sales architects, account executives and innovation leads
    use_cases:
      - Clickable demo during or right after a discovery call
      - Concept validation before investing in a design sprint
      - First SOW outline for a new idea
    model: flash
    model_reason: Screen design and journey reasoning need Flash; the critic runs on Flash-Lite and rendering is deterministic.
    pattern: loop
    steps:
      - id: builder
        name: Prototype builder
        model: flash
        role: Designs the screens of the core journey and renders the clickable prototype.
        instruction: |
          Critic feedback from the previous round (none on the first round):
          {{prototype_review}}

          1. From the user's concept, identify the primary user, the core journey (3-5 steps) and the value moment.
          2. Design 3-6 screens. Each screen has an id, name, purpose, components (kpi / list / form / table / chat /
             map / chart / text, filled with realistic synthetic sample data) and actions that move the journey forward.
          3. Call ops_render_clickable_prototype and fix every error it reports.
          4. Apply every numbered fix from the critic, if any.
          Output the final screen spec exactly as passed to the tool, the prototype id and the tool's checks. Do not paste
          the HTML.
        tools: [ops_render_clickable_prototype]
        output_key: prototype_draft
      - id: critic
        name: Demo critic
        model: lite
        role: Checks the prototype spec against the concept and the demo checklist.
        instruction: |
          Prototype spec and checks:
          {{prototype_draft}}

          Checklist: (1) the core journey from the concept can be clicked end to end; (2) 3-6 screens, no broken links or
          dead ends; (3) sample data is realistic, synthetic and uses no real company or brand names; (4) at least one
          screen shows the value moment (a KPI, an approval, an assistant answer); (5) labels are in the user's language.
          State what passes and what fails.
        output_key: prototype_review
    tools: [ops_render_clickable_prototype, ops_draft_sow_outline]
    grounding: []
    instruction: |
      Approved prototype spec:
      {{prototype_draft}}

      Critic review:
      {{prototype_review}}

      1. Call ops_render_clickable_prototype with the approved spec and output the returned HTML unchanged in a single
         html code block — it is self-contained, so the user can save it and open it in a browser.
      2. Call ops_draft_sow_outline with the concept title, the number of screens and the integrations the concept
         implies.
      3. Present the SOW outline: objective, phases with weeks and deliverables, estimate range (label it an estimate
         from an illustrative rate card), assumptions, out of scope and acceptance. Recommend a Thoth review before it is
         sent to anyone.
    output: >-
      One-line concept summary, the clickable demo (full HTML in a code block), screen list, then "Draft SOW outline" with
      phases table, estimate range, assumptions, out of scope and next steps.
    samples:
      - "Dream-to-demo: a field inspection app for a real-estate developer — inspectors log defects with photos and PMs approve fixes."
      - "Prototype a member portal for a credit union: loan status, document upload and an assistant chat."
      - "Turn this idea into a clickable demo and SOW outline: a volunteer shift scheduler for a food bank with SMS reminders."
    related: [thoth, vulcan, mercator]
    kpis: [Concept-to-demo time, Demos converted to SOWs, Discovery workshops shortened]

  - id: thoth
    code: Tho
    name: Thoth · SOW Language & Risk Grader
    cluster: innovation
    status: in_build
    tagline: Grades draft SOWs clause by clause against the legal playbook and writes the redlines.
    description: >-
      Thoth reviews statements of work before they leave Wursta. A Flash-Lite scanner splits the draft into clauses and
      flags risky or ambiguous language deterministically (unlimited revisions, subjective acceptance, outcome
      guarantees, uncapped liability, penalties, IP grabs, informal change control); the grader then reasons over the
      whole document with the SOW Legal Playbook, confirms or adjusts each grade, finds contradictions the patterns
      miss, and writes redlines with preferred and fallback language.
    persona: Engagement leads, deal desk and legal reviewers
    use_cases:
      - Pre-legal review of every draft SOW
      - Redlines with preferred and fallback language
      - Risk grade before a SOW is sent to the client
    model: argon
    model_reason: >-
      Legal-risk reasoning over ambiguous language is the product and a missed red clause costs far more than tokens —
      the one Argon agent in this part of the realm, and only for the final grading step after a Flash-Lite pre-scan.
    pattern: sequential
    steps:
      - id: scanner
        name: Clause scanner
        model: lite
        role: Splits the SOW into clauses and flags risky language deterministically.
        instruction: |
          Identify the SOW in the user's message (a document key such as 'ops_sow_draft_kestrel', or pasted clause text)
          and call ops_sow_clause_scan. Output every clause with its number, section, text, risk level and matched rule
          ids, then the missing sections, the counts and the preliminary grade, exactly as returned.
        tools: [ops_sow_clause_scan]
        output_key: clause_scan
    tools: []
    grounding: [kb]
    instruction: |
      Clause pre-scan:
      {{clause_scan}}

      1. Search the SOW Legal Playbook (knowledge base) and grade each flagged clause red / amber / green. You may change
         a pre-scan grade only with a one-line reason.
      2. Look for what patterns cannot catch: contradictions between clauses, unrealistic timelines, obligations
         without an owner, dependencies on third parties.
      3. For every red and amber clause write a redline: original → proposed (the playbook's preferred language adapted
         to this SOW) → fallback position.
      4. Confirm the overall grade on the playbook's A-F scale and the approval route (Legal for any red).
    output: >-
      "SOW grade: <A-F>" headline with counts, clause table (clause, risk, issue), redlines (original → proposed →
      fallback) red first, missing sections, approval routing.
    samples:
      - Grade the draft SOW 'ops_sow_draft_kestrel' clause by clause and give me redlines.
      - Which clauses in 'ops_sow_draft_kestrel' would Legal reject outright, and what is our fallback language?
      - "Grade this clause: 'Wursta guarantees the model will be 99% accurate and will provide unlimited revisions until the client is fully satisfied.'"
    sample_doc: ops_sow_draft_kestrel
    related: [mercator, morpheus, nomos]
    kpis: [Red clauses caught before signature, Legal review turnaround time, Change requests caused by ambiguous scope]

