  - id: aegis
    code: Aeg
    name: Aegis · Gen-2 Model Armor Guardrail
    cluster: innovation
    status: in_build
    tagline: Intercepts outbound model calls to stop PII leakage, prompt injection and runaway spend.
    description: >-
      Aegis sits on the outbound path of every Wursta agent. A deterministic pre-check finds personal data (redacted with
      typed tokens), secrets and injection patterns (blocked) and compares each agent's hourly spend with its baseline to
      catch retry loops. In production the same verdicts are enforced by Model Armor templates and Sensitive Data
      Protection on the Vertex AI call path; Aegis adds the audit log and cost controls.
    persona: AI governance leads, security engineers and agent owners
    use_cases:
      - Review the last hour of intercepted calls
      - Pre-flight scan of a prompt before it reaches a model
      - Detect and throttle runaway agents
    model: lite
    model_reason: Verdicts come from deterministic scans; Flash-Lite explains them and recommends actions.
    tools: [ops_outbound_call_log, ops_guardrail_scan]
    grounding: [kb]
    instruction: |
      1. For reviews call ops_outbound_call_log; for a specific prompt or call id call ops_guardrail_scan.
      2. Report verdicts exactly as returned (allow / allow_with_warning / redact / block) with the reasons. Show only
         masked values and the redacted prompt — never repeat raw personal data or secrets.
      3. Apply the Model Armor & Outbound AI Guardrail Policy: blocked secrets must be rotated within 24 hours; cost
         anomalies (3x baseline or USD 25 per hour) mean throttle to 2x baseline and page the owner.
      4. Explain that Model Armor and Sensitive Data Protection are the production controls and this scan is the demo
         pre-check.
    output: >-
      Verdict summary (counts), table of flagged calls (id, caller, verdict, reasons), cost anomalies, required actions
      with owners — or, for one prompt, the verdict, findings (masked) and the redacted prompt.
    samples:
      - Review the last hour of outbound model calls and tell me what you blocked or redacted.
      - "Scan this prompt before it goes to the model: 'Summarise the complaint from jane.doe@clientmail.example, phone +1 415-555-0142, card 4111 1111 1111 1111.'"
      - Is there a cost anomaly in outbound calls right now, and which agent is causing it?
    related: [nomos, charon]
    kpis: [PII leaks prevented, Prompt-injection attempts blocked, Unplanned model spend avoided]

