compositions:
  - id: pantheon_engagement
    name: Pantheon strategy engagement
    kind: workflow
    status: Demo ready
    summary: >-
      Hermes ingests discovery material and decides which specialists to call — Xenophon (backlog), Daedalus (cloud
      architecture), Ariadne (data), Prometheus (risk & schedule), Proteus (value) — then synthesises one executive
      deliverable.
    agents: [hermes, xenophon, daedalus, ariadne, prometheus, proteus, pantheon]
    flow:
      - Discovery notes / transcript / whiteboard photo in
      - Hermes (Argon) decomposes the problem
      - Specialists run as AgentTools (Flash, Daedalus on Argon)
      - Hermes synthesises executive summary, risks, plan and next steps
    blocks:
      models: Argon for the coordinator and the architect; Flash for the other specialists; Flash-Lite for extraction skills.
      runtime: One Agent Engine (Platform Core); specialists are in-process AgentTools — one session, one trace.
      tools: Jira backlog (simulated), GCP cost estimator, ERD/DDL tools, CPM scheduler, ROI calculator.
      grounding: Platform knowledge base (Architecture Framework notes, delivery playbooks) + Google Search.

  - id: atlas_migration
    name: Atlas Workspace migration pipeline
    kind: workflow
    status: Shipped
    summary: Seven Atlas agents run a legacy-email-to-Google-Workspace migration from pre-flight audit to daily status.
    agents: [atlas_preflight, atlas_batch_planner, atlas_user_comms, atlas_data_mover, atlas_delta_sync, atlas_validator, atlas_status]
    flow:
      - Pre-flight audit of the legacy tenant
      - Wave planning by department and data complexity
      - Personalised user comms per wave
      - Bulk data transfer, then delta sync before cutover
      - Post-migration validation and daily status report
    blocks:
      models: Flash-Lite for comms and status; Flash for planning and validation.
      runtime: Wursta Delivery Engine Agent Engine; each Atlas agent can run alone or as a stage.
      tools: Synthetic tenant inventory, wave planner, transfer and checksum simulators.
      grounding: Delivery knowledge base (migration runbook, cutover checklist).

  - id: citizen_services_framework
    name: Citizen Services Framework
    kind: framework
    status: Proposed — PoC design (not deployed)
    summary: >-
      A sovereign-cloud-ready blueprint for national digital services: a messaging front-end (e.g. WhatsApp), citizen
      sign-in through the national identity provider via Workforce Identity Federation, and specialised agents that
      reuse hive patterns. The agents here are reference prototypes, not a deployed client system.
    agents: [farmer_desk, business_registry, housing_credit, citizen_311, policy_qa]
    flow:
      - Citizen writes on the messaging channel
      - Identity verified with the national IdP (OIDC + Workforce Identity Federation)
      - "Farmer Desk (Citizen Desk pattern) · Business Registry (Action Tracker pattern) · Housing & Credit (RFP Analyst pattern)"
      - Governance layer logs every turn (telemetry, DLP, Model Armor)
    blocks:
      models: Flash-Lite for intake and routing; Flash for eligibility and comparisons.
      runtime: Agent Engine per programme; messaging gateway on Cloud Run.
      tools: Registration checklists, eligibility rules, financial-product comparison.
      grounding: Government knowledge base (programme rules, requirements) — synthetic in this demo.

  - id: realestate_sync_proposal
    name: Real-estate enterprise sync (proposal)
    kind: proposal
    status: Proposed architecture — not built
    summary: >-
      How Vulcan would remove double data entry between a CRM, a construction-management platform and BigQuery for a
      real-estate developer — designed with Ariadne (data model) and Daedalus (cloud architecture).
    agents: [vulcan, ariadne, daedalus]
    flow:
      - Vulcan maps CRM deals and construction projects to one canonical model
      - Ariadne designs the BigQuery star schema and sync DDL
      - Daedalus sizes Cloud Run + Pub/Sub + BigQuery and estimates cost
    blocks:
      models: Flash for mapping; Argon for the architecture decision record.
      runtime: Proposed Cloud Run middleware + Agent Engine for the agents.
      tools: Field-mapping and conflict-resolution simulators, ERD and cost tools.
      grounding: Platform knowledge base + vendor API docs via Google Search.

  - id: meeting_intelligence
    name: Meeting intelligence loop
    kind: workflow
    status: Shipped + in build
    summary: Every client meeting becomes knowledge, alerts, tasks and a churn signal.
    agents: [janus, helios, athena, oracle]
    flow:
      - Janus turns the recording into an OKF knowledge record
      - Helios scores sentiment, scope creep and disengagement
      - Athena creates tasks with owners and due dates
      - Oracle updates the account's churn-risk score
    blocks:
      models: "Flash-Lite for Janus and Athena, Flash for Helios and Oracle; the skills themselves run on Flash-Lite."
      runtime: Wursta Delivery Engine Agent Engine.
      tools: extract-video-to-okf, detect-meeting-sentiment-risk, extract-meeting-structured-data skills.
      grounding: Engagement history (synthetic) + delivery knowledge base.

