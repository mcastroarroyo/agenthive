title: The Wursta Agent Hive
subtitle: Every Wursta agent in one place — pick a use case, open an agent, and watch it work live on Google Cloud.

statuses:
  demo_ready: {label: Demo ready, description: "Polished, client-presentable demo."}
  built: {label: "Built — demo needed", description: "Agent exists; demo storyline still being polished."}
  in_build: {label: In build, description: "Under active development; prototype demo available here."}
  library: {label: "Library — not built yet", description: "Designed pattern; this hive runs a reference prototype."}

